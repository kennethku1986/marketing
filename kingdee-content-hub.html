<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金蝶香港 · Marketing 內容規劃中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+HK:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --accent:#3A6FF7;
    --accent-soft:#E8EEFF;
    --accent-dark:#2650C4;
    --bg:#F3F5FA;
    --surface:#FFFFFF;
    --border:#E3E6EF;
    --text:#1F2430;
    --muted:#6B7280;
    --amber:#F5A524; --amber-soft:#FFF3DE;
    --blue:#3A6FF7;  --blue-soft:#E8EEFF;
    --green:#12B76A; --green-soft:#E3F9EE;
    --purple:#7C5CFC;--purple-soft:#EFEAFF;
    --red:#F04438;   --red-soft:#FEECEB;
    --gray:#9AA1B2;  --gray-soft:#F1F2F5;
    --radius:12px;
    --shadow:0 1px 2px rgba(20,33,61,.05), 0 8px 24px -12px rgba(20,33,61,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter','Noto Sans HK',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Space Grotesk','Noto Sans HK',sans-serif;}
  ::selection{background:var(--accent-soft);}

  /* header */
  .topbar{
    background:var(--ink); color:#fff; padding:22px 32px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#7C5CFC);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';
    font-size:15px; flex:none;
  }
  .brand h1{font-size:18px;margin:0;font-weight:600; letter-spacing:.2px;}
  .brand .sub{font-size:12px;color:#AEB8D6;margin-top:2px;}

  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:10px;}
  .tab-btn{
    border:none;background:transparent;color:#C7D0EC;padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .tab-btn.active{background:#fff;color:var(--ink);}
  .tab-btn:not(.active):hover{color:#fff;}

  main{max-width:1280px;margin:0 auto;padding:24px 32px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  /* toolbar */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .filter-select, .search-input{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:8px 10px;font-size:13px;font-family:inherit;color:var(--text);
  }
  .search-input{min-width:180px;}
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-icon{padding:7px 9px;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn-danger-text{background:transparent;color:var(--red);border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;}

  /* empty state */
  .empty{
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
    padding:48px 24px;text-align:center;color:var(--muted);
  }
  .empty b{color:var(--text);display:block;font-size:15px;margin-bottom:4px;}

  /* table (list view) */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;padding:12px 14px;background:#FAFBFD;color:var(--muted);
    font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFF;}
  .topic-cell b{display:block;font-size:13.5px;}
  .topic-cell .date{color:var(--muted);font-size:12px;margin-top:2px;}
  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .chan-pill{background:var(--gray-soft);color:#4B5265;margin:2px 3px 0 0;}
  .link-cell a{color:var(--accent);text-decoration:none;font-size:12px;}
  .link-cell a:hover{text-decoration:underline;}
  .row-actions{display:flex;gap:10px;}
  .row-actions button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-family:inherit;font-weight:600;padding:0;}
  .row-actions button:hover{color:var(--accent);}
  .row-actions button.del:hover{color:var(--red);}

  /* status colors helper classes applied via JS */
  .st-amber{background:var(--amber-soft);color:#9A6400;}
  .st-blue{background:var(--blue-soft);color:var(--accent-dark);}
  .st-green{background:var(--green-soft);color:#0A7A4C;}
  .st-purple{background:var(--purple-soft);color:#5B3EE0;}
  .st-red{background:var(--red-soft);color:#C4281C;}
  .st-gray{background:var(--gray-soft);color:#5B6272;}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;color:var(--text);}
  .cal-nav button:hover{border-color:var(--accent);color:var(--accent);}
  .cal-title{font-size:19px;font-weight:700;min-width:130px;text-align:center;}
  .cal-grid{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#FAFBFD;border-bottom:1px solid var(--border);}
  .cal-dow div{padding:10px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .cal-body{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{
    min-height:104px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:6px;position:relative;cursor:pointer;transition:.12s;
  }
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell:hover{background:#FAFBFF;}
  .cal-cell.out{background:#FCFCFD;}
  .cal-cell.out .daynum{color:#C7CCDA;}
  .cal-cell.today .daynum{
    background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;
  }
  .daynum{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:inline-block;}
  .cal-item{
    font-size:11px;padding:2px 6px;border-radius:5px;margin-bottom:3px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  }
  .cal-more{font-size:10.5px;color:var(--muted);padding-left:6px;cursor:pointer;}
  .cal-add-btn{
    position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;border:none;
    background:var(--accent-soft);color:var(--accent);font-size:12px;line-height:1;cursor:pointer;opacity:0;transition:.12s;
  }
  .cal-cell:hover .cal-add-btn{opacity:1;}

  /* legend */
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  /* kanban for work report */
  .kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .kcol{background:#FAFBFD;border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:120px;}
  .kcol h3{font-size:12.5px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text);}
  .kcol h3 .count{font-size:11px;color:var(--muted);font-weight:600;}
  .kcard{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;
    cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(20,33,61,.04);
  }
  .kcard:hover{border-color:var(--accent);}
  .kcard b{display:block;font-size:13px;margin-bottom:4px;}
  .kcard .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .type-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;}
  .type-online{background:var(--blue-soft);color:var(--accent-dark);}
  .type-offline{background:var(--purple-soft);color:#5B3EE0;}

  /* modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:50;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 60px -20px rgba(20,33,61,.35);
    animation:pop .15s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .modal-head{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;}
  .modal-head h2{font-size:17px;margin:0;}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
  .modal-body{padding:16px 24px 24px;display:flex;flex-direction:column;gap:14px;max-height:74vh;overflow-y:auto;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text], .field input[type=url], .field input[type=date], .field textarea, .field select{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13.5px;
    font-family:inherit;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .chan-check{display:flex;flex-wrap:wrap;gap:8px;}
  .chan-check label{
    display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;
    padding:6px 10px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  .chan-check input{margin:0;}
  .utm-box{background:#FAFBFD;border:1px solid var(--border);border-radius:10px;padding:12px;}
  .utm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .utm-grid input{border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;}
  .utm-out{
    background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:11.5px;
    word-break:break-all;color:var(--muted);display:flex;align-items:center;gap:8px;
  }
  .utm-out code{flex:1;color:var(--text);}
  .modal-foot{padding:14px 24px 22px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--border);margin-top:4px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:720px){
    .topbar{padding:16px;} main{padding:16px;}
    .row2{grid-template-columns:1fr;} .utm-grid{grid-template-columns:1fr;}
    thead{display:none;} tbody tr{display:block;border-bottom:8px solid var(--bg);}
    tbody td{display:block;border:none;padding:6px 14px;}
    tbody td:first-child{padding-top:12px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">KD</div>
    <div>
      <h1>金蝶香港 · Marketing 內容規劃中心</h1>
      <div class="sub">Content Hub — 規劃、審批追蹤與進度匯報</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="calendar">📅 內容日曆</button>
    <button class="tab-btn" data-view="list">📋 內容清單</button>
    <button class="tab-btn" data-view="work">🛠 工作進度匯報</button>
  </div>
</div>

<main>

  <!-- ===== CALENDAR VIEW ===== -->
  <section id="view-calendar" class="view active">
    <div class="cal-head">
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button id="calNext">›</button>
        <button class="btn btn-ghost btn-sm" id="calToday" style="width:auto;padding:6px 12px;">今天</button>
      </div>
      <button class="btn btn-primary" id="calAddBtn">＋ 新增內容</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
      <div class="cal-body" id="calBody"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--amber)"></i>待提交</span>
      <span><i style="background:#EAA400"></i>待審批</span>
      <span><i style="background:var(--green)"></i>已批准</span>
      <span><i style="background:var(--purple)"></i>需修改</span>
      <span><i style="background:var(--red)"></i>已拒絕</span>
    </div>
  </section>

  <!-- ===== LIST VIEW ===== -->
  <section id="view-list" class="view">
    <div class="toolbar">
      <div class="toolbar-left">
        <input class="search-input" id="listSearch" placeholder="搜尋主題／備註...">
        <select class="filter-select" id="filterApproval">
          <option value="">所有審批狀態</option>
          <option>待提交</option><option>待審批</option><option>已批准</option><option>需修改</option><option>已拒絕</option>
        </select>
        <select class="filter-select" id="filterChannel">
          <option value="">所有渠道</option>
          <option>Facebook</option><option>Instagram</option><option>LinkedIn</option>
          <option>微信 WeChat</option><option>網站 Website</option><option>EDM</option><option>YouTube</option><option>其他</option>
        </select>
        <select class="filter-select" id="filterIntl">
          <option value="">是否國際通用</option>
          <option>全球通用</option><option>只限香港</option><option>部分地區通用</option>
        </select>
      </div>
      <button class="btn btn-primary" id="listAddBtn">＋ 新增內容</button>
    </div>
    <div id="listContainer"></div>
  </section>

  <!-- ===== WORK REPORT VIEW ===== -->
  <section id="view-work" class="view">
    <div class="toolbar">
      <div class="toolbar-left">
        <select class="filter-select" id="workTypeFilter">
          <option value="">所有類型</option>
          <option value="online">線上建設</option>
          <option value="offline">線下活動</option>
          <option value="other">其他</option>
        </select>
        <input class="search-input" id="workSearch" placeholder="搜尋項目名稱...">
      </div>
      <button class="btn btn-primary" id="workAddBtn">＋ 新增項目</button>
    </div>
    <div class="kanban" id="kanbanBoard"></div>
  </section>

</main>

<!-- ===== CONTENT MODAL ===== -->
<div class="overlay" id="contentOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="contentModalTitle">新增內容</h2>
      <button class="modal-close" data-close-content>✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>主題 Topic</label>
        <input type="text" id="f_topic" placeholder="例如：中秋節限時優惠推廣">
      </div>
      <div class="row2">
        <div class="field">
          <label>發佈日期</label>
          <input type="date" id="f_date">
        </div>
        <div class="field">
          <label>是否國際通用</label>
          <select id="f_intl">
            <option>只限香港</option><option>全球通用</option><option>部分地區通用</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>發出渠道（可多選）</label>
        <div class="chan-check" id="f_channels">
          <label><input type="checkbox" value="Facebook">Facebook</label>
          <label><input type="checkbox" value="Instagram">Instagram</label>
          <label><input type="checkbox" value="LinkedIn">LinkedIn</label>
          <label><input type="checkbox" value="微信 WeChat">微信 WeChat</label>
          <label><input type="checkbox" value="網站 Website">網站 Website</label>
          <label><input type="checkbox" value="EDM">EDM</label>
          <label><input type="checkbox" value="YouTube">YouTube</label>
          <label><input type="checkbox" value="其他">其他</label>
        </div>
      </div>
      <div class="field">
        <label>上級審批狀態</label>
        <select id="f_approval">
          <option>待提交</option><option>待審批</option><option>已批准</option><option>需修改</option><option>已拒絕</option>
        </select>
      </div>
      <div class="field">
        <label>原始連結 Link</label>
        <input type="url" id="f_link" placeholder="https://...">
      </div>
      <div class="utm-box">
        <label style="display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;">UTM 參數</label>
        <div class="utm-grid">
          <input type="text" id="u_source" placeholder="utm_source（例如 facebook）">
          <input type="text" id="u_medium" placeholder="utm_medium（例如 social）">
          <input type="text" id="u_campaign" placeholder="utm_campaign（例如 midautumn2026）">
          <input type="text" id="u_content" placeholder="utm_content（選填）">
          <input type="text" id="u_term" placeholder="utm_term（選填）">
        </div>
        <div class="utm-out">
          <code id="utmResult">在上方輸入連結及UTM參數，將自動生成完整連結</code>
          <button class="btn btn-ghost btn-sm" id="copyUtmBtn" style="flex:none;">複製</button>
        </div>
      </div>
      <div class="field">
        <label>備註</label>
        <textarea id="f_notes" placeholder="其他補充資訊..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger-text" id="deleteContentBtn" style="display:none;">刪除此內容</button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost" data-close-content>取消</button>
      <button class="btn btn-primary" id="saveContentBtn">儲存</button>
    </div>
  </div>
</div>

<!-- ===== WORK MODAL ===== -->
<div class="overlay" id="workOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="workModalTitle">新增工作項目</h2>
      <button class="modal-close" data-close-work>✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>項目名稱</label>
        <input type="text" id="w_name" placeholder="例如：官網ERP產品頁面改版">
      </div>
      <div class="row2">
        <div class="field">
          <label>類型</label>
          <select id="w_type">
            <option value="online">線上建設</option>
            <option value="offline">線下活動</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="field">
          <label>負責人（選填）</label>
          <input type="text" id="w_owner" placeholder="例如：Ivy">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>狀態</label>
          <select id="w_status">
            <option>籌備中</option>
            <option>進行中</option>
            <option>已執行</option>
            <option>等待復盤</option>
            <option>已結案</option>
            <option>已延期</option>
            <option>已暫停</option>
            <option>已取消</option>
          </select>
        </div>
        <div class="field">
          <label>日期</label>
          <input type="date" id="w_date">
        </div>
      </div>
      <div class="field">
        <label>備註</label>
        <textarea id="w_notes" placeholder="進度說明、下一步行動..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-danger-text" id="deleteWorkBtn" style="display:none;">刪除此項目</button>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost" data-close-work>取消</button>
      <button class="btn btn-primary" id="saveWorkBtn">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- state ---------------- */
let contentItems = [];
let workItems = [];
let editingContentId = null;
let editingWorkId = null;
let calYear, calMonth; // calMonth 0-11

const APPROVAL_COLOR = {
  '待提交':'st-amber', '待審批':'st-amber', '已批准':'st-green', '需修改':'st-purple', '已拒絕':'st-red'
};
const APPROVAL_DOT = {
  '待提交':'var(--amber)', '待審批':'#EAA400', '已批准':'var(--green)', '需修改':'var(--purple)', '已拒絕':'var(--red)'
};
const WORK_STATUS_COLOR = {
  '籌備中':'st-amber','進行中':'st-blue','已執行':'st-green','等待復盤':'st-purple',
  '已結案':'st-green','已延期':'st-gray','已暫停':'st-gray','已取消':'st-red'
};
const WORK_COLUMNS = ['籌備中','進行中','已執行','等待復盤','已結案','已延期','已暫停','已取消'];

function uid(){ return 'id' + Date.now() + Math.random().toString(16).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- storage ---------------- */
async function loadData(){
  try{
    const c = await window.storage.get('content-items');
    contentItems = c ? JSON.parse(c.value) : [];
  }catch(e){ contentItems = []; }
  try{
    const w = await window.storage.get('work-items');
    workItems = w ? JSON.parse(w.value) : [];
  }catch(e){ workItems = []; }
}
async function persistContent(){
  try{ await window.storage.set('content-items', JSON.stringify(contentItems)); }
  catch(e){ console.error('storage error', e); showToast('儲存失敗，請重試'); }
}
async function persistWork(){
  try{ await window.storage.set('work-items', JSON.stringify(workItems)); }
  catch(e){ console.error('storage error', e); showToast('儲存失敗，請重試'); }
}

/* ---------------- tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='calendar') renderCalendar();
    if(btn.dataset.view==='list') renderList();
    if(btn.dataset.view==='work') renderKanban();
  });
});

/* ================= CONTENT MODAL ================= */
const contentOverlay = document.getElementById('contentOverlay');
function openContentModal(id, presetDate){
  editingContentId = id || null;
  document.getElementById('contentModalTitle').textContent = id ? '編輯內容' : '新增內容';
  document.getElementById('deleteContentBtn').style.display = id ? 'inline-flex' : 'none';
  const item = id ? contentItems.find(x=>x.id===id) : null;

  document.getElementById('f_topic').value = item?.topic || '';
  document.getElementById('f_date').value = item?.date || presetDate || '';
  document.getElementById('f_intl').value = item?.intl || '只限香港';
  document.getElementById('f_approval').value = item?.approval || '待提交';
  document.getElementById('f_link').value = item?.link || '';
  document.getElementById('u_source').value = item?.utm?.source || '';
  document.getElementById('u_medium').value = item?.utm?.medium || '';
  document.getElementById('u_campaign').value = item?.utm?.campaign || '';
  document.getElementById('u_content').value = item?.utm?.content || '';
  document.getElementById('u_term').value = item?.utm?.term || '';
  document.getElementById('f_notes').value = item?.notes || '';

  document.querySelectorAll('#f_channels input').forEach(cb=>{
    cb.checked = item?.channels?.includes(cb.value) || false;
  });

  updateUtmPreview();
  contentOverlay.classList.add('open');
}
function closeContentModal(){ contentOverlay.classList.remove('open'); }
document.querySelectorAll('[data-close-content]').forEach(b=>b.addEventListener('click', closeContentModal));
document.getElementById('calAddBtn').addEventListener('click', ()=>openContentModal(null));
document.getElementById('listAddBtn').addEventListener('click', ()=>openContentModal(null));

function buildUtmUrl(){
  const base = document.getElementById('f_link').value.trim();
  if(!base) return '';
  const params = {
    utm_source: document.getElementById('u_source').value.trim(),
    utm_medium: document.getElementById('u_medium').value.trim(),
    utm_campaign: document.getElementById('u_campaign').value.trim(),
    utm_content: document.getElementById('u_content').value.trim(),
    utm_term: document.getElementById('u_term').value.trim(),
  };
  const qs = Object.entries(params).filter(([k,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  if(!qs) return base;
  try{
    const url = new URL(base);
    const sep = url.search ? '&' : '?';
    return base + sep + qs;
  }catch(e){
    const sep = base.includes('?') ? '&' : '?';
    return base + sep + qs;
  }
}
function updateUtmPreview(){
  const url = buildUtmUrl();
  const el = document.getElementById('utmResult');
  el.textContent = url || '在上方輸入連結及UTM參數，將自動生成完整連結';
}
['f_link','u_source','u_medium','u_campaign','u_content','u_term'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateUtmPreview);
});
document.getElementById('copyUtmBtn').addEventListener('click', ()=>{
  const url = buildUtmUrl();
  if(!url){ showToast('請先輸入連結'); return; }
  navigator.clipboard?.writeText(url).then(()=>showToast('已複製連結')).catch(()=>showToast('複製失敗'));
});

document.getElementById('saveContentBtn').addEventListener('click', async ()=>{
  const topic = document.getElementById('f_topic').value.trim();
  if(!topic){ showToast('請輸入主題'); return; }
  const channels = Array.from(document.querySelectorAll('#f_channels input:checked')).map(cb=>cb.value);
  const data = {
    id: editingContentId || uid(),
    topic,
    date: document.getElementById('f_date').value,
    intl: document.getElementById('f_intl').value,
    approval: document.getElementById('f_approval').value,
    link: document.getElementById('f_link').value.trim(),
    channels,
    utm: {
      source: document.getElementById('u_source').value.trim(),
      medium: document.getElementById('u_medium').value.trim(),
      campaign: document.getElementById('u_campaign').value.trim(),
      content: document.getElementById('u_content').value.trim(),
      term: document.getElementById('u_term').value.trim(),
    },
    notes: document.getElementById('f_notes').value.trim(),
  };
  if(editingContentId){
    const idx = contentItems.findIndex(x=>x.id===editingContentId);
    contentItems[idx] = data;
  } else {
    contentItems.push(data);
  }
  await persistContent();
  closeContentModal();
  renderCalendar(); renderList();
  showToast('已儲存');
});
document.getElementById('deleteContentBtn').addEventListener('click', async ()=>{
  if(!editingContentId) return;
  contentItems = contentItems.filter(x=>x.id!==editingContentId);
  await persistContent();
  closeContentModal();
  renderCalendar(); renderList();
  showToast('已刪除');
});

/* ================= WORK MODAL ================= */
const workOverlay = document.getElementById('workOverlay');
function openWorkModal(id, presetType){
  editingWorkId = id || null;
  document.getElementById('workModalTitle').textContent = id ? '編輯工作項目' : '新增工作項目';
  document.getElementById('deleteWorkBtn').style.display = id ? 'inline-flex' : 'none';
  const item = id ? workItems.find(x=>x.id===id) : null;
  document.getElementById('w_name').value = item?.name || '';
  document.getElementById('w_type').value = item?.type || presetType || 'online';
  document.getElementById('w_owner').value = item?.owner || '';
  document.getElementById('w_status').value = item?.status || '籌備中';
  document.getElementById('w_date').value = item?.date || '';
  document.getElementById('w_notes').value = item?.notes || '';
  workOverlay.classList.add('open');
}
function closeWorkModal(){ workOverlay.classList.remove('open'); }
document.querySelectorAll('[data-close-work]').forEach(b=>b.addEventListener('click', closeWorkModal));
document.getElementById('workAddBtn').addEventListener('click', ()=>openWorkModal(null));

document.getElementById('saveWorkBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('w_name').value.trim();
  if(!name){ showToast('請輸入項目名稱'); return; }
  const data = {
    id: editingWorkId || uid(),
    name,
    type: document.getElementById('w_type').value,
    owner: document.getElementById('w_owner').value.trim(),
    status: document.getElementById('w_status').value,
    date: document.getElementById('w_date').value,
    notes: document.getElementById('w_notes').value.trim(),
  };
  if(editingWorkId){
    const idx = workItems.findIndex(x=>x.id===editingWorkId);
    workItems[idx] = data;
  } else {
    workItems.push(data);
  }
  await persistWork();
  closeWorkModal();
  renderKanban();
  showToast('已儲存');
});
document.getElementById('deleteWorkBtn').addEventListener('click', async ()=>{
  if(!editingWorkId) return;
  workItems = workItems.filter(x=>x.id!==editingWorkId);
  await persistWork();
  closeWorkModal();
  renderKanban();
  showToast('已刪除');
});

/* ================= CALENDAR RENDER ================= */
function renderCalendar(){
  const title = document.getElementById('calTitle');
  title.textContent = `${calYear} 年 ${calMonth+1} 月`;
  const body = document.getElementById('calBody');
  body.innerHTML = '';

  const firstDay = new Date(calYear, calMonth, 1);
  // Monday-first index: 0=Mon..6=Sun
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  const cells = [];
  for(let i=startOffset-1;i>=0;i--){
    cells.push({day: daysInPrevMonth - i, out:true, ym:{y:calMonth===0?calYear-1:calYear, m:calMonth===0?11:calMonth-1}});
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({day:d, out:false, ym:{y:calYear, m:calMonth}});
  }
  while(cells.length % 7 !== 0 || cells.length < 35){
    cells.push({day: cells.length - (startOffset+daysInMonth) + 1, out:true, ym:{y:calMonth===11?calYear+1:calYear, m:calMonth===11?0:calMonth+1}});
  }

  cells.forEach(cell=>{
    const dateStr = `${cell.ym.y}-${String(cell.ym.m+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`;
    const div = document.createElement('div');
    div.className = 'cal-cell' + (cell.out?' out':'') + (dateStr===todayStr?' today':'');
    const dn = document.createElement('span');
    dn.className='daynum'; dn.textContent = cell.day;
    div.appendChild(dn);

    const addBtn = document.createElement('button');
    addBtn.className='cal-add-btn'; addBtn.textContent='+';
    addBtn.title='新增內容';
    addBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openContentModal(null, dateStr); });
    div.appendChild(addBtn);

    const dayItems = contentItems.filter(it=>it.date===dateStr);
    const maxShow = 3;
    dayItems.slice(0,maxShow).forEach(it=>{
      const pill = document.createElement('div');
      pill.className='cal-item';
      const colorClass = APPROVAL_COLOR[it.approval] || 'st-gray';
      pill.classList.add(colorClass);
      pill.textContent = it.topic;
      pill.addEventListener('click',(e)=>{ e.stopPropagation(); openContentModal(it.id); });
      div.appendChild(pill);
    });
    if(dayItems.length>maxShow){
      const more = document.createElement('div');
      more.className='cal-more';
      more.textContent = `+${dayItems.length-maxShow} 更多`;
      more.addEventListener('click',(e)=>{ e.stopPropagation(); openContentModal(dayItems[maxShow].id); });
      div.appendChild(more);
    }
    div.addEventListener('click', ()=> openContentModal(null, dateStr));
    body.appendChild(div);
  });
}
document.getElementById('calPrev').addEventListener('click', ()=>{
  calMonth--; if(calMonth<0){calMonth=11; calYear--;} renderCalendar();
});
document.getElementById('calNext').addEventListener('click', ()=>{
  calMonth++; if(calMonth>11){calMonth=0; calYear++;} renderCalendar();
});
document.getElementById('calToday').addEventListener('click', ()=>{
  const n = new Date(); calYear=n.getFullYear(); calMonth=n.getMonth(); renderCalendar();
});

/* ================= LIST RENDER ================= */
function renderList(){
  const search = document.getElementById('listSearch').value.trim().toLowerCase();
  const fApproval = document.getElementById('filterApproval').value;
  const fChannel = document.getElementById('filterChannel').value;
  const fIntl = document.getElementById('filterIntl').value;

  let items = [...contentItems].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  items = items.filter(it=>{
    if(search && !(it.topic.toLowerCase().includes(search) || (it.notes||'').toLowerCase().includes(search))) return false;
    if(fApproval && it.approval !== fApproval) return false;
    if(fChannel && !(it.channels||[]).includes(fChannel)) return false;
    if(fIntl && it.intl !== fIntl) return false;
    return true;
  });

  const container = document.getElementById('listContainer');
  if(items.length===0){
    container.innerHTML = `<div class="empty"><b>未有內容記錄</b>按「新增內容」開始規劃你的第一個項目。</div>`;
    return;
  }

  const rows = items.map(it=>{
    const url = it.link ? (buildUtmForItem(it) || it.link) : '';
    const chanHtml = (it.channels||[]).map(c=>`<span class="pill chan-pill">${esc(c)}</span>`).join('');
    const apClass = APPROVAL_COLOR[it.approval] || 'st-gray';
    return `<tr data-id="${it.id}">
      <td class="topic-cell"><b>${esc(it.topic)}</b><div class="date">${it.date || '未定日期'}</div></td>
      <td>${chanHtml || '<span style="color:var(--muted);font-size:12px;">未指定</span>'}</td>
      <td><span class="pill ${apClass}">${esc(it.approval)}</span></td>
      <td><span class="pill st-gray">${esc(it.intl)}</span></td>
      <td class="link-cell">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">開啟連結 ↗</a>` : '<span style="color:var(--muted);font-size:12px;">—</span>'}</td>
      <td style="max-width:180px;color:var(--muted);font-size:12px;">${esc(it.notes||'—')}</td>
      <td>
        <div class="row-actions">
          <button class="edit">編輯</button>
          <button class="del">刪除</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>
      <th>主題／日期</th><th>渠道</th><th>審批狀態</th><th>國際通用</th><th>連結</th><th>備註</th><th>操作</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;

  container.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id = tr.dataset.id;
    tr.querySelector('.edit').addEventListener('click', ()=>openContentModal(id));
    tr.querySelector('.del').addEventListener('click', async ()=>{
      contentItems = contentItems.filter(x=>x.id!==id);
      await persistContent();
      renderList(); renderCalendar();
      showToast('已刪除');
    });
  });
}
function buildUtmForItem(it){
  if(!it.link) return '';
  const params = {
    utm_source: it.utm?.source, utm_medium: it.utm?.medium, utm_campaign: it.utm?.campaign,
    utm_content: it.utm?.content, utm_term: it.utm?.term
  };
  const qs = Object.entries(params).filter(([k,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  if(!qs) return it.link;
  const sep = it.link.includes('?') ? '&' : '?';
  return it.link + sep + qs;
}
['listSearch','filterApproval','filterChannel','filterIntl'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderList);
  document.getElementById(id).addEventListener('change', renderList);
});

/* ================= WORK KANBAN RENDER ================= */
function renderKanban(){
  const typeFilter = document.getElementById('workTypeFilter').value;
  const search = document.getElementById('workSearch').value.trim().toLowerCase();
  let items = [...workItems];
  items = items.filter(it=>{
    if(typeFilter && it.type !== typeFilter) return false;
    if(search && !it.name.toLowerCase().includes(search)) return false;
    return true;
  });

  const board = document.getElementById('kanbanBoard');
  if(workItems.length===0){
    board.innerHTML = `<div class="empty" style="grid-column:1/-1;"><b>未有工作進度記錄</b>按「新增項目」開始記錄線上建設或線下活動的進度。</div>`;
    return;
  }

  board.innerHTML = WORK_COLUMNS.map(status=>{
    const colItems = items.filter(it=>it.status===status).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const cards = colItems.map(it=>{
      const typeLabel = it.type==='online' ? '線上建設' : it.type==='offline' ? '線下活動' : '其他';
      const typeClass = it.type==='online' ? 'type-online' : it.type==='offline' ? 'type-offline' : '';
      return `<div class="kcard" data-id="${it.id}">
        <b>${esc(it.name)}</b>
        <div class="meta">
          <span class="type-tag ${typeClass}">${typeLabel}</span>
          ${it.date ? `<span>${it.date}</span>`:''}
          ${it.owner ? `<span>· ${esc(it.owner)}</span>`:''}
        </div>
      </div>`;
    }).join('');
    return `<div class="kcol">
      <h3>${status} <span class="count">${colItems.length}</span></h3>
      ${cards || '<div style="font-size:12px;color:var(--muted);">暫無項目</div>'}
    </div>`;
  }).join('');

  board.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('click', ()=>openWorkModal(card.dataset.id));
  });
}
['workTypeFilter','workSearch'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderKanban);
  document.getElementById(id).addEventListener('change', renderKanban);
});

/* ================= INIT ================= */
(async function init(){
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  await loadData();
  renderCalendar();
  renderList();
  renderKanban();
})();
</script>
</body>
</html>
